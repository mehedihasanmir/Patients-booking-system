services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bytevoice
      POSTGRES_PASSWORD: bytevoice
      POSTGRES_DB: bytevoice
    ports:
      - "5432:5432"
    volumes:
      - bytevoice_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bytevoice -d bytevoice"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  bytevoice_pg:
