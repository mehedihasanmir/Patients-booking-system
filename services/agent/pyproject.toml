[project]
name = "bytevoice-agent"
version = "0.1.0"
description = "ByteVoice Bangla LiveKit voice worker"
requires-python = ">=3.11"
dependencies = [
  "livekit-agents[openai,silero,turn-detector,google]>=1.2.0,<2",
  "livekit-api>=0.8.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["bytevoice_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"
