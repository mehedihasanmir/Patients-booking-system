[project]
name = "bytevoice-api"
version = "0.1.0"
description = "ByteVoice Bangla receptionist API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "pyjwt>=2.10.0",
  "bcrypt>=4.2.0",
  "httpx>=0.28.0",
  "langgraph>=0.2.60",
  "openai>=1.55.0",
  "dateparser>=1.2.0",
  "livekit-api>=0.8.0",
  "python-multipart>=0.0.17",
  "greenlet>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Bangla reply strings are long. Depends() in FastAPI defaults is the framework pattern.
ignore = ["E501", "B008", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = ["app.models", "app.seed", "app.db"]
ignore_errors = true
